<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Frezon Mod</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
background: rgba(25, 25, 35, 0.92);
backdrop-filter: blur(25px);
-webkit-backdrop-filter: blur(25px);
border-radius: 25px;
border: 1px solid rgba(255, 255, 255, 0.08);
box-shadow: 0 30px 60px rgba(0,0,0,0.6);
color: #fff;
padding: 18px 20px 20px 20px;
width: 100%;
height: 100%;
overflow: hidden;
position: relative;
}
.header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 18px;
padding-bottom: 12px;
border-bottom: 1px solid rgba(255,255,255,0.06);
}
.logo {
font-size: 20px;
font-weight: 700;
background: linear-gradient(135deg, #6dd5fa, #4facfe, #a18cd1);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
letter-spacing: 0.5px;
}
.version {
font-size: 11px;
color: rgba(255,255,255,0.3);
background: rgba(255,255,255,0.05);
padding: 3px 10px;
border-radius: 12px;
}
.close-btn {
background: rgba(255,255,255,0.05);
border: none;
color: #888;
font-size: 18px;
cursor: pointer;
padding: 4px 12px;
border-radius: 8px;
transition: 0.2s;
}
.close-btn:active { background: rgba(255,255,255,0.12); color: #fff; }
.lang-section {
display: flex;
gap: 8px;
justify-content: center;
margin-bottom: 18px;
}
.lang-btn {
background: rgba(255,255,255,0.04);
border: 1px solid rgba(255,255,255,0.06);
color: #888;
padding: 6px 14px;
border-radius: 20px;
font-size: 13px;
cursor: pointer;
transition: all 0.25s;
}
.lang-btn.active {
background: rgba(79, 172, 254, 0.2);
border-color: #4facfe;
color: #fff;
}
.lang-btn:active { transform: scale(0.94); }
.feature-card {
background: rgba(255,255,255,0.03);
border-radius: 16px;
padding: 14px 18px;
margin-bottom: 12px;
border: 1px solid rgba(255,255,255,0.04);
display: flex;
justify-content: space-between;
align-items: center;
}
.feature-info { flex: 1; }
.feature-title {
font-size: 16px;
font-weight: 600;
color: #eee;
margin-bottom: 2px;
}
.feature-sub {
font-size: 12px;
color: rgba(255,255,255,0.35);
}
.toggle-btn {
width: 52px;
height: 30px;
background: #2a2a3a;
border-radius: 15px;
position: relative;
cursor: pointer;
transition: background 0.3s;
flex-shrink: 0;
border: 1px solid rgba(255,255,255,0.06);
}
.toggle-btn.active {
background: #4facfe;
border-color: #4facfe;
}
.toggle-btn .thumb {
width: 24px;
height: 24px;
background: #fff;
border-radius: 12px;
position: absolute;
top: 2px;
left: 2px;
transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}
.toggle-btn.active .thumb { left: 24px; }
.status-badge {
display: inline-block;
font-size: 11px;
padding: 2px 12px;
border-radius: 12px;
margin-top: 4px;
}
.status-badge.off {
background: rgba(255,80,80,0.12);
color: #ff6b6b;
}
.status-badge.on {
background: rgba(79,172,254,0.15);
color: #4facfe;
}
.extra-action {
background: rgba(255,255,255,0.03);
border-radius: 12px;
padding: 10px 16px;
display: flex;
justify-content: space-between;
align-items: center;
border: 1px solid rgba(255,255,255,0.03);
margin-top: 4px;
}
.extra-action span {
font-size: 14px;
color: #aaa;
}
.extra-action .hint {
font-size: 12px;
color: rgba(255,255,255,0.25);
}
.footer {
text-align: center;
margin-top: 14px;
font-size: 10px;
color: rgba(255,255,255,0.12);
letter-spacing: 0.5px;
}
</style>
</head>
<body>
<div class="header">
<span class="logo">Frezon Mod</span>
<span class="version">v1.0</span>
<button class="close-btn" onclick="closeMenu()">✕</button>
</div>
<div class="lang-section">
<button class="lang-btn active" data-lang="ar" onclick="switchLang('ar')">عربي</button>
<button class="lang-btn" data-lang="en" onclick="switchLang('en')">English</button>
<button class="lang-btn" data-lang="zh" onclick="switchLang('zh')">中文</button>
</div>
<div class="feature-card">
<div class="feature-info">
<div class="feature-title" id="feature-title">Unlimited Everything</div>
<div class="feature-sub" id="feature-sub">Activate all resources</div>
<div class="status-badge off" id="status-badge">● Off</div>
</div>
<div class="toggle-btn" id="main-toggle" onclick="toggleFeature()">
<div class="thumb"></div>
</div>
</div>
<div class="extra-action" onclick="alert('Feature coming soon')">
<span>Reset Progress</span>
<span class="hint">Coming soon</span>
</div>
<div class="footer">Frezon Mod</div>
<script>
const translations = {
ar: { title: 'Frezon Mod', feature: 'كل شيء غير محدود', sub: 'تفعيل جميع الموارد', status_on: '● مفعل', status_off: '● غير مفعل' },
en: { title: 'Frezon Mod', feature: 'Unlimited Everything', sub: 'Activate all resources', status_on: '● On', status_off: '● Off' },
zh: { title: 'Frezon Mod', feature: '无限一切', sub: '激活所有资源', status_on: '● 开', status_off: '● 关' }
};
let currentLang = 'ar';
let isActive = false;
function switchLang(lang) {
currentLang = lang;
const t = translations[lang];
document.querySelector('.logo').textContent = t.title;
document.getElementById('feature-title').textContent = t.feature;
document.getElementById('feature-sub').textContent = t.sub;
updateStatusText();
document.querySelectorAll('.lang-btn').forEach(btn => {
btn.classList.toggle('active', btn.dataset.lang === lang);
});
document.body.dir = lang === 'ar' ? 'rtl' : 'ltr';
}
function updateStatusText() {
const t = translations[currentLang];
const badge = document.getElementById('status-badge');
badge.textContent = isActive ? t.status_on : t.status_off;
badge.className = 'status-badge ' + (isActive ? 'on' : 'off');
}
function toggleFeature() {
isActive = !isActive;
const toggle = document.getElementById('main-toggle');
toggle.classList.toggle('active', isActive);
updateStatusText();
const action = isActive ? 'unlimited_on' : 'unlimited_off';
window.webkit.messageHandlers.modAction.postMessage(action);
}
function closeMenu() {
window.webkit.messageHandlers.modAction.postMessage('close_menu');
}
updateStatusText();
</script>
</body>
</html>
