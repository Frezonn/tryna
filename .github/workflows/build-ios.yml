name: Build Frezon Mod (dylib)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build dylib
        run: |
          # تجميع جميع ملفات المصدر
          SOURCES=""
          
          # أضف ملفات المصدر (بدون Tweak.xm لأنه يحتوي على %ctor)
          if [ -f "WalletManager.m" ]; then
            SOURCES="$SOURCES WalletManager.m"
          fi
          
          if [ -f "Tweak.xm" ]; then
            # حول Tweak.xm إلى Tweak.m (بحذف سطور %ctor مؤقتاً)
            cp Tweak.xm Tweak.m
            # استبدل %ctor بدالة عادية
            sed -i '' 's/%ctor/__attribute__((constructor))/g' Tweak.m
            SOURCES="$SOURCES Tweak.m"
          fi
          
          # إذا لم توجد ملفات مصدر، استخدم ملف اختبار
          if [ -z "$SOURCES" ]; then
            echo "⚠️ لا توجد ملفات مصدر، أنشئ ملف اختبار"
            cat > test.m << 'EOF'
#import <Foundation/Foundation.h>

__attribute__((constructor))
static void initialize() {
    NSLog(@"Frezon Mod loaded!");
}
EOF
            SOURCES="test.m"
          fi
          
          echo "📄 الملفات المبنية: $SOURCES"
          
          # بناء dylib
          clang -dynamiclib \
            -target arm64-apple-ios13.0 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -framework QuartzCore \
            -framework WebKit \
            -o FrezonMod.dylib \
            $SOURCES
          
          echo "✅ تم البناء بنجاح!"
          ls -la *.dylib
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frezon-mod-dylib
          path: "*.dylib"
