name: Build Frezon Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build dylib
        run: |
          # البحث عن ملفات المصدر
          SOURCES=$(find . -type f \( -name "*.mm" -o -name "*.m" \) | tr '\n' ' ')
          
          if [ -z "$SOURCES" ]; then
            echo "No source files found"
            exit 1
          fi
          
          echo "Building files: $SOURCES"
          
          # بناء dylib
          clang -dynamiclib \
            -target arm64-apple-ios13.0 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -framework QuartzCore \
            -framework WebKit \
            -o FrezonMod.dylib \
            $SOURCES
          
          echo "Build completed!"
          ls -la *.dylib
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frezon-mod
          path: "*.dylib"
