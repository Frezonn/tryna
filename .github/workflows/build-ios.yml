name: Build Frezon Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build dylib
        run: |
          SOURCES=""
          
          if [ -f "WalletManager.m" ]; then
            SOURCES="$SOURCES WalletManager.m"
          fi
          
          if [ -f "Tweak.xm" ]; then
            cp Tweak.xm Tweak.m
            SOURCES="$SOURCES Tweak.m"
          fi
          
          if [ -z "$SOURCES" ]; then
            echo "No source files found"
            exit 1
          fi
          
          echo "Building: $SOURCES"
          
          clang -dynamiclib \
            -target arm64-apple-ios13.0 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -framework QuartzCore \
            -framework WebKit \
            -o FrezonMod.dylib \
            $SOURCES
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frezon-mod
          path: "*.dylib"
          
