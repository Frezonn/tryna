name: Build FrezonMod Tweak

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: theos/theos:latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Build Tweak
      run: |
        make package FINALPACKAGE=1
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FrezonMod-Build
        path: packages/
        retention-days: 30
