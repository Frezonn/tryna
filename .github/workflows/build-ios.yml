name: Build FrezonMod Tweak

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git ~/theos
        echo "THEOS=~/theos" >> $GITHUB_ENV
    
    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential fakeroot devscripts clang llvm
    
    - name: Create Makefile
      run: |
        cat > Makefile << 'EOF'
        ARCHS = arm64
        TARGET = iphone:clang:14.4:13.0
        
        include $(THEOS)/makefiles/common.mk
        
        TWEAK_NAME = FrezonMod
        FrezonMod_FILES = Tweak.m WalletManager.m
        FrezonMod_FRAMEWORKS = UIKit Foundation WebKit
        FrezonMod_CFLAGS = -fobjc-arc
        
        include $(THEOS)/makefiles/tweak.mk
        EOF
    
    - name: Build Tweak
      run: |
        export THEOS=~/theos
        make package FINALPACKAGE=1
    
    - name: List build output
      run: ls -lah packages/
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FrezonMod-Deb
        path: packages/
        retention-days: 30
