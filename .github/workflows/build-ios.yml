name: Build iOS Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build iOS Dylib
        run: |
          # ابحث عن جميع ملفات .m و .mm
          SOURCES=$(find . -name "*.m" -o -name "*.mm" | tr '\n' ' ')
          
          if [ -z "$SOURCES" ]; then
            echo "⚠️ لا توجد ملفات .m أو .mm"
            exit 1
          fi
          
          clang -dynamiclib \
            -target arm64-apple-ios13.0 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -framework QuartzCore \
            -o libmylib.dylib \
            $SOURCES
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-dylib
          path: "*.dylib"
          
