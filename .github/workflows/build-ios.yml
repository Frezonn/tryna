- name: Compile with clang
  run: |
    # Create output directory
    mkdir -p build
    
    # Get iOS SDK path
    SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)
    
    # Compile WalletManager.m
    clang -fPIC -fobjc-arc \
      -isysroot $SDKPATH \
      -framework UIKit \
      -framework Foundation \
      -framework WebKit \
      -c WalletManager.m -o build/WalletManager.o
    
    # Compile Tweak.m
    clang -fPIC -fobjc-arc \
      -isysroot $SDKPATH \
      -framework UIKit \
      -framework Foundation \
      -framework WebKit \
      -c Tweak.m -o build/Tweak.o
    
    # Link into a dylib
    clang -fPIC -fobjc-arc \
      -isysroot $SDKPATH \
      -framework UIKit \
      -framework Foundation \
      -framework WebKit \
      -shared \
      -o build/FrezonMod.dylib \
      build/WalletManager.o \
      build/Tweak.o
    
    echo "✓ Build successful!"
    ls -lah build/
