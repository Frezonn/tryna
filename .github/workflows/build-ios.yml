name: Build FrezonMod Tweak

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Build with clang
      run: |
        mkdir -p build
        
        # Compile Tweak.m
        clang -fPIC -fobjc-arc \
          -isysroot $(xcrun --sdk macosx --show-sdk-path) \
          -c Tweak.m -o build/Tweak.o
        
        # Compile WalletManager.m
        clang -fPIC -fobjc-arc \
          -isysroot $(xcrun --sdk macosx --show-sdk-path) \
          -c WalletManager.m -o build/WalletManager.o
        
        # Link into a dylib
        clang -fPIC -fobjc-arc \
          -isysroot $(xcrun --sdk macosx --show-sdk-path) \
          -shared \
          -o build/FrezonMod.dylib \
          build/Tweak.o build/WalletManager.o
        
        echo "✓ Build successful!"
        ls -lah build/
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FrezonMod-Build
        path: build/
        retention-days: 30
