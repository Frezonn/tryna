name: Build FrezonMod Tweak

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Compile with clang
      run: |
        # Create output directory
        mkdir -p build
        
        # Compile Objective-C files to object files
        clang -fPIC -fobjc-arc \
          -framework UIKit \
          -framework Foundation \
          -framework WebKit \
          -c WalletManager.m -o build/WalletManager.o
        
        clang -fPIC -fobjc-arc \
          -framework UIKit \
          -framework Foundation \
          -framework WebKit \
          -c Tweak.m -o build/Tweak.o
        
        # Link into a dylib (dynamic library for iOS)
        clang -fPIC -fobjc-arc \
          -framework UIKit \
          -framework Foundation \
          -framework WebKit \
          -shared \
          -o build/FrezonMod.dylib \
          build/WalletManager.o \
          build/Tweak.o
        
        echo "✓ Build successful!"
        ls -lah build/
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FrezonMod-Build
        path: build/
        retention-days: 30
