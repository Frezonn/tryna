name: Build Frezon Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Xcode
        run: |
          # تحديد إصدارة Xcode (اختياري)
          # sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          
          # التحقق من Xcode
          xcode-select --print-path
          xcrun --version
      
      - name: Check iOS SDK
        run: |
          # إظهار SDK المتاح
          xcrun --sdk iphoneos --show-sdk-path
          echo "---"
          ls -la "$(xcrun --sdk iphoneos --show-sdk-path)"
      
      - name: Build dylib
        run: |
          # البحث عن ملفات المصدر
          SOURCES=$(find . -type f \( -name "*.mm" -o -name "*.m" \) | tr '\n' ' ')
          
          if [ -z "$SOURCES" ]; then
            echo "No source files found"
            exit 1
          fi
          
          echo "Building files: $SOURCES"
          
          # الحصول على paths الضرورية
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          DEPLOYMENT_TARGET=13.0
          
          # بناء dylib
          clang \
            -dynamiclib \
            -target arm64-apple-ios${DEPLOYMENT_TARGET} \
            -isysroot "${SDK_PATH}" \
            -fmodules \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -framework QuartzCore \
            -framework WebKit \
            -o FrezonMod.dylib \
            ${SOURCES}
          
          echo "✅ Build completed!"
          ls -lah FrezonMod.dylib
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frezon-mod
          path: FrezonMod.dylib
